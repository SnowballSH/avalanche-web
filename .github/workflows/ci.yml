name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/snowballsh/avalanche-web
  LOCAL_IMAGE: avalanche-web:ci

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - id: pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-pins/out
          key: pins-${{ runner.os }}-${{ hashFiles('engines/pins.json', 'scripts/build-pins.sh', 'scripts/build-avalanche-wasm.sh', 'scripts/pins-catalogue.ts', 'src/lib/pins/catalogue-source.ts') }}
      - if: steps.pins.outputs.cache-hit != 'true'
        run: scripts/build-pins.sh build-pins/out
      - run: scripts/check-pins-abi.sh build-pins/out
      - run: npm run test:integration
        env:
          AVALANCHE_FIXTURE_WASM: build-pins/out/engines/master-9b7ee6f/avalanche.wasm
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=avalanche-web-image
          cache-to: type=gha,scope=avalanche-web-image,mode=max
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:served
        env:
          AVALANCHE_IMAGE: ${{ env.LOCAL_IMAGE }}
          CONTAINER_ENGINE: docker
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${LOCAL_IMAGE}" | gzip -1 > image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker tag "${LOCAL_IMAGE}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
      - name: Record the registry digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for ${IMAGE}:sha-${GITHUB_SHA}" >&2; exit 1; }
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:snowballsh/avalanche-web:pull" | jq -r '.token // empty' || true)"
          anonymous="$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/snowballsh/avalanche-web/manifests/${digest}")"
          {
            echo "### Avalanche Web image"
            echo ""
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo ""
            echo "Built and served-image tested at commit ${GITHUB_SHA}; tags sha-${GITHUB_SHA} and latest."
            echo "Anonymous pull of the digest answers ${anonymous}; the SnowSys host holds no registry credential, so the package must be public."
          } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${anonymous}" == "200" ]] || echo "::warning::${IMAGE} is not anonymously pullable (HTTP ${anonymous}); make the package public before deploying"
