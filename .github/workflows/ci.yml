name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - id: pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-pins/out
          key: pins-${{ runner.os }}-${{ hashFiles('engines/pins.json', 'scripts/build-pins.sh', 'scripts/build-avalanche-wasm.sh', 'scripts/pins-catalogue.ts', 'src/lib/pins/catalogue-source.ts') }}
      - if: steps.pins.outputs.cache-hit != 'true'
        run: scripts/build-pins.sh build-pins/out
      - run: scripts/check-pins-abi.sh build-pins/out
      - run: npm run test:integration
        env:
          AVALANCHE_FIXTURE_WASM: build-pins/out/engines/master-9b7ee6f/avalanche.wasm
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
