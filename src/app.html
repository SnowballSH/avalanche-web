<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfdff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1220" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-svh bg-surface font-sans text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
